version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance-api
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    env_file:
      - .env
    ports:
      - "8001:8001"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped